<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galvez — Quest Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/>
          <rect x="2" y="6" width="20" height="12" rx="5"/>
        </svg>
      </div>
      <div>
        <h1>Galvez Quest Log</h1>
        <p>Track your runs, builds and backlog</p>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Quests</span></div>
    <div class="stat done"><b id="sDone">0</b><span>Cleared</span></div>
    <div class="stat"><b id="sOpen">0</b><span>Active</span></div>
    <div class="stat"><b id="sRate">0%</b><span>Rate</span></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="dot"></span>
      <h2 id="formTitle">Forge a new quest</h2>
      <span class="edit-flag" id="editFlag">Editing</span>
    </div>
    <div class="panel-body">
      <form id="questForm" autocomplete="off">
        <input type="hidden" id="qId">
        <div class="field">
          <label for="fTitle">Quest name</label>
          <input type="text" id="fTitle" required maxlength="70" placeholder="e.g. Speedrun Nightfall with no summons">
        </div>
        <div class="field">
          <label for="fNote">Details</label>
          <textarea id="fNote" rows="3" maxlength="400" placeholder="Build notes, objectives, party invite…"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label for="fTag">Category</label>
            <select id="fTag">
              <option>Raid</option>
              <option>Speedrun</option>
              <option>Grind</option>
              <option>Story</option>
              <option>Co-op</option>
              <option>Backlog</option>
            </select>
          </div>
          <div class="field">
            <label for="fDiff">Difficulty</label>
            <select id="fDiff">
              <option>Normal</option>
              <option>Hard</option>
              <option>Nightmare</option>
              <option>Legendary</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <span class="hint" id="hint">Saved locally — survives refresh &amp; restart</span>
          <button type="button" class="btn btn-ghost" id="cancelBtn" style="display:none">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <span id="saveLabel">Add quest</span>
          </button>
        </div>
      </form>
    </div>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="search" placeholder="Search quests…">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>
    <p id="emptyText">No quests logged yet</p>
    <small>Forge your first quest using the form above.</small>
  </div>

  <p class="foot">PixelForge · data stored in this browser via localStorage</p>
</div>

<div class="toast" id="toast"><i></i><span id="toastMsg"></span></div>

<script src="app.js"></script>
</body>
</html>
